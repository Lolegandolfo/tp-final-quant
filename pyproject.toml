[project]
name = "hpca-merval"
version = "0.1.0"
description = "Hierarchical PCA (Avellaneda 2019) aplicado a acciones argentinas"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "yfinance>=0.2.50",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
]

[tool.uv]
package = false
